version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: proteccion
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: proteccion-db
    ports:
      - "5440:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5